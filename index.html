    <script>
      (function() {
        var ignoredErrors = [
          'Could not establish connection. Receiving end does not exist.',
          'The message port closed before a response was received.',
          'ResizeObserver loop completed with undelivered notifications.',
          'ResizeObserver loop limit exceeded',
          'Extension context invalidated'
        ];
        function matchesIgnored(msg) {
          if (!msg) return false;
          var str = String(msg);
          for (var i = 0; i < ignoredErrors.length; i++) {
            if (str.indexOf(ignoredErrors[i]) !== -1) return true;
          }
          return false;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason ? (event.reason.message || event.reason) : '');
          if (matchesIgnored(reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var message = event && (event.message || event.error);
          if (matchesIgnored(message)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
